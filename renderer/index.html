<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src ws: wss:; style-src 'self'; script-src 'self'">
  <title>Telinha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Entrada -->
  <section id="lobby">
    <div class="card">
      <img class="logo" src="icon.png" alt="">
      <h1>Telinha</h1>
      <p class="sub">Compartilhe a tela com som para até 5 amigos</p>

      <label>Seu nick
        <input id="name" maxlength="32" placeholder="Como te chamam?" autocomplete="off">
      </label>

      <button id="go" class="primary big">Entrar na sala</button>
      <p id="lobby-error" class="error"></p>
    </div>
  </section>

  <!-- Sala -->
  <section id="room" hidden>
    <aside>
      <div class="brand">
        <img src="icon.png" alt="">
        <div><b>Telinha</b><span>Sala principal</span></div>
      </div>

      <div id="vpn" class="vpn">
        <span class="vpn-dot"></span>
        <div class="vpn-text"><b id="vpn-title">Radmin VPN</b><span id="vpn-detail">Verificando...</span></div>
        <button id="vpn-open" title="Abrir o Radmin VPN">Abrir</button>
      </div>

      <p id="status" class="status" hidden>Sem conexão com os servidores de busca. Confira a internet, o firewall ou o antivírus.</p>

      <div id="people"></div>

      <div class="me">
        <div class="me-info">
          <span id="me-avatar" class="avatar"></span>
          <div class="me-text"><b id="me-name"></b><span id="me-state"></span></div>
        </div>
        <div class="me-actions">
          <button id="change" hidden></button>
          <button id="share" class="primary"></button>
        </div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <h2>
          <svg class="ico" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Sala principal
        </h2>
        <span id="count" class="count"></span>
      </header>
      <div id="stage">
        <div id="empty"></div>
      </div>
    </main>
  </section>

  <!-- Seletor de tela -->
  <dialog id="picker">
    <h3 tabindex="-1" autofocus>Escolha o que compartilhar</h3>
    <div class="tabs" id="kind-tabs">
      <button class="tab active" data-kind="screen">Telas</button>
      <button class="tab" data-kind="window">Janelas</button>
    </div>
    <div id="sources"></div>
    <div class="picker-opts">
      <label>Qualidade
        <select id="quality">
          <option value="720p30">720p · 30 fps</option>
          <option value="1080p30" selected>1080p · 30 fps</option>
          <option value="1080p60">1080p · 60 fps</option>
        </select>
      </label>
      <label>Som
        <select id="audio-mode"></select>
      </label>
    </div>
    <div class="picker-actions">
      <button id="picker-cancel">Cancelar</button>
      <button id="picker-go" class="live-btn" disabled>
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/></svg>
        Entrar ao vivo
      </button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
